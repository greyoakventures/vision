:root{--ink:#101114;--ink2:#5c6168;--mute:#8B939C;--bg:#F3F5F7;--card:#fff;--line:#D5DBE1;--steel:#B4BBC3;
--amber:#FFB000;--purple:#5B4BCC;--purple-d:#3f318f;--purple-l:#ece9ff;--good:#18a364;--bad:#b42318;--r:22px;
--font:'Satoshi','Helvetica Neue',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
background-image:radial-gradient(circle at 12% 18%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 40%,#fff 0 1.5px,transparent 2.5px);background-size:140px 140px,180px 180px}
.hero{position:relative;overflow:hidden;color:#fff;padding:22px 18px 74px;background:linear-gradient(160deg,#101114 0%,#141a2e 50%,#2a2266 100%)}
.hero::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-38px;height:80px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.wrap{max-width:1080px;margin:0 auto;position:relative;z-index:2}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:42px;height:42px;border-radius:10px;box-shadow:0 0 0 1px rgba(243,245,247,.22);display:block}
.brand-text{font-weight:900;font-size:17px;letter-spacing:-.01em}
.who-badge{font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border-radius:999px;background:var(--purple);color:#fff}
.who-badge.owner{background:#fff;color:var(--ink);border:2px dashed var(--amber)}
h1{font-size:clamp(28px,5.4vw,46px);line-height:1.04;margin:18px 0 6px;font-weight:900;letter-spacing:-.035em}
h1 span{color:#b9b0ff}
.sub{margin:0;color:#cfd3ff;font-size:15px;max-width:620px}
.upd{color:#aab0c8;font-size:12px;margin-top:10px;font-weight:700}
main{max-width:1080px;margin:0 auto;padding:0 14px 40px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-48px 0 18px;position:relative;z-index:3}
.stat{background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 12px}
@media(max-width:520px){.stat{padding:8px 9px}.stat span{font-size:10px}.stat.money b{font-size:19px;margin-top:4px}}
@media(min-width:861px){.sum{grid-template-columns:repeat(6,1fr)}.sum.n5{grid-template-columns:repeat(5,1fr)}}
.stat b{display:block;font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.stat.money{background:var(--ink);color:#fff}.stat.money span{color:#cfd3ff}
.stat.money small{display:block;font-size:11px;color:#aab0c8;font-weight:700;margin-top:2px}
.est{background:var(--purple-l);border:1.5px dashed var(--purple);color:var(--purple-d);border-radius:14px;padding:9px 12px;font-size:13px;font-weight:700;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}
.truck{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:0 6px 0 var(--ink);padding:14px 14px 12px;overflow:hidden}
.truck.off{border-style:dashed;box-shadow:0 6px 0 var(--steel);border-color:var(--steel)}
.thead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tname{font-weight:900;font-size:19px;letter-spacing:-.02em}
.dest{font-size:14px;color:var(--ink2);font-weight:700;margin-top:2px}
.req{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#fff6db;border:1.5px solid var(--amber);color:#7a5200;white-space:nowrap}
.status{margin:8px 0 0;font-weight:900;font-size:17px}
.status .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--amber);margin-right:8px;vertical-align:middle;animation:ping 1.6s infinite}
.status.done .dot{background:var(--good);animation:none}.status.off .dot{background:var(--steel);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,176,0,.6)}70%{box-shadow:0 0 0 10px rgba(255,176,0,0)}100%{box-shadow:0 0 0 0 rgba(255,176,0,0)}}
.road{position:relative;margin:10px -14px 0;height:132px;background:linear-gradient(#eef1f5 0 70%,#d9dee5 70% 100%)}
.road svg.scene{position:absolute;inset:0;width:100%;height:100%}
.rig{position:absolute;bottom:24px;width:200px;height:92px}
.rig svg{width:100%;height:100%;display:block}
.road{padding:0 8px}
.endlbl{position:absolute;bottom:4px;font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.steps{display:grid;gap:4px;margin:12px 0 4px;list-style:none;padding:0}
.steps.s4{grid-template-columns:repeat(4,1fr)}.steps.s6{grid-template-columns:repeat(6,1fr)}
.steps li{text-align:center;font-size:11px;font-weight:800;color:var(--mute);line-height:1.15}
.steps li i{display:block;height:8px;border-radius:99px;background:#e3e7ec;margin-bottom:5px}
.steps li.on{color:var(--ink)}.steps li.on i{background:var(--purple)}
.steps li.now i{background:var(--amber)}
.steps li.money.on i{background:var(--good)}
.steps li small{display:block;color:var(--ink2);font-weight:700;font-size:10px;margin-top:1px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bdg{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:#f4f6f9;color:var(--ink2)}
.bdg.ok{background:#e6f6ee;border-color:#9fd9bd;color:#0f6b41}
.bdg.warn{background:#fff6db;border-color:var(--amber);color:#7a5200}
.bdg.bad{background:#fdecea;border-color:#f1aaa3;color:var(--bad)}
.bdg.pp{background:var(--purple);border-color:var(--purple);color:#fff}
.inv{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:9px;font-size:13px;color:var(--ink2)}
.inv b{color:var(--ink)}
.note{font-size:13px;color:var(--ink2);margin:8px 0 0}
footer{max-width:1080px;margin:0 auto;padding:0 18px 30px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
<div class="topline"><div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#101114"/><path fill="#F3F5F7" d="M14 48V16h9.2l8.8 16.6L40.8 16H50v32h-8.4V28.2L32 46.2 22.4 28.2V48H14z"/></svg><span class="brand-text">MichiganSalt</span></div>
<span class="who-badge owner">Nick only</span></div>
<h1>Advance trucks, <span>owner view</span></h1>
<p class="sub">Every Purple Power truckload from Advance Lawn Service: where it is, whether Advance invoiced it, and whether we paid.</p>
<div class="upd" id="upd"></div>
</div></header>
<main><div class="sum" id="sum"></div><div id="est"></div><div class="grid" id="grid"><p>Loading trucks</p></div></main>
<footer>Purple Power: calcium chloride treated rock salt, 22 one-ton super sacks per truckload. Works to -20°F.</footer>
<script>
const MODE="owner";
const $=s=>document.querySelector(s);
const money=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>{if(!d)return"";const [y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString("en-US",{month:"short",day:"numeric"})};
const ORDER=["not_approved","approved","scheduled","shipped","delivered"];
function sack(x,y){return `<g transform="translate(${x},${y})"><rect x="0" y="4" width="22" height="24" rx="4" fill="#fff" stroke="#101114" stroke-width="1.6"/><rect x="0" y="13" width="22" height="6" fill="#5B4BCC"/><path d="M5 4 L8 0 M17 4 L14 0" stroke="#101114" stroke-width="1.4" fill="none"/></g>`}
function rig(id){let s="";for(let i=0;i<5;i++)s+=sack(12+i*26,6);for(let i=0;i<4;i++)s+=sack(25+i*26,-16);
return `<svg viewBox="0 -18 210 96" class="rigsvg" aria-label="Flatbed semi with Purple Power super sacks">
${s}
<rect x="6" y="34" width="140" height="8" rx="2" fill="#101114"/>
<rect x="8" y="42" width="136" height="18" rx="3" fill="#5B4BCC"/>
<text x="76" y="55.5" text-anchor="middle" font-family="Satoshi,Helvetica Neue,sans-serif" font-weight="900" font-size="11" fill="#fff" letter-spacing="1">PURPLE POWER</text>
<rect x="144" y="46" width="12" height="10" fill="#101114"/>
<path d="M202 60 V34 q0-6 -6-8 l-14-4 h-12 v38z" fill="#5B4BCC" stroke="#101114" stroke-width="2"/>
<path d="M196 34 l-12-6 h-9 v12 h21z" fill="#bfe3ff" stroke="#101114" stroke-width="1.5"/>
<rect x="164" y="14" width="4" height="10" fill="#B4BBC3" stroke="#101114" stroke-width="1"/>
<rect x="198" y="54" width="8" height="4" rx="1" fill="#FFB000"/>
${[40,60,140,186].map(c=>`<circle cx="${c}" cy="68" r="9" fill="#101114"/><circle cx="${c}" cy="68" r="3.5" fill="#B4BBC3"/>`).join("")}
</svg>`}
function pos(stage){return {not_approved:0,approved:4,scheduled:30,shipped:62,delivered:100}[stage]??4}
function card(t,yard){
 const idx=ORDER.indexOf(t.stage), off=t.stage==="not_approved";
 const lbl={not_approved:"Not yet approved",approved:"Approved for shipment",scheduled:"Scheduled",shipped:"Shipped, on the road",delivered:"Delivered"}[t.stage];
 const done=MODE==="owner"?(t.stage==="delivered"&&t.paid):t.stage==="delivered";
 const sc=off?"off":done?"done":"";
 const st=[["approved","Approved"],["scheduled","Scheduled"],["shipped","Shipped"],["delivered","Delivered"]];
 let steps=st.map(([k,n],i)=>{const on=idx>=i+1, now=idx===i+1&&t.stage!=="delivered";const d=t.dates&&t.dates[k];return `<li class="${on?"on":""} ${now?"now":""}"><i></i>${n}${d?`<small>${fd(d)}</small>`:""}</li>`}).join("");
 let badges=[];
 /*O*/if(MODE==="owner"){
  const inv=!!t.invoice;
  steps+=`<li class="money ${inv?"on":""}"><i></i>Invoiced${inv?`<small>${fd(t.invoice.date)}</small>`:""}</li><li class="money ${t.paid?"on":""}"><i></i>Paid${t.paid&&t.paidDate?`<small>${fd(t.paidDate)}</small>`:""}</li>`;
  badges.push(inv?`<span class="bdg ok">Advance invoiced</span>`:`<span class="bdg">Not invoiced yet</span>`);
  if(inv)badges.push(t.paid?`<span class="bdg ok">Paid to Advance</span>`:`<span class="bdg bad">Unpaid to Advance</span>`);
  if(t.customerPaid===true)badges.push(`<span class="bdg pp">Customer paid us</span>`);
  if(t.customerPaid===false)badges.push(`<span class="bdg warn">Customer not paid yet</span>`);
 }else/*E*/{
  if(t.invoiceReceived)badges.push(`<span class="bdg ok">&#10003; Invoice received${t.invoiceNo?` (#${t.invoiceNo})`:""}</span>`);
 }
 /*O*/const invHtml=MODE==="owner"&&t.invoice?`<div class="inv">Invoice <b>#${t.invoice.number}</b> · <b>${money(t.invoice.amount)}</b> · sent ${fd(t.invoice.date)} · due <b>${fd(t.invoice.due)}</b>${t.invoice.match?`<br>${t.invoice.match}`:""}${t.invoice.detail?`<br>${t.invoice.detail}`:""}</div>`:"";/*E*/
 const left=pos(t.stage);
 return `<article class="truck ${off?"off":""}">
 <div class="thead"><div><div class="tname">${t.label}</div><div class="dest">To: ${t.dest}</div></div>${t.requested?`<span class="req">Requested: ${t.requested}</span>`:""}</div>
 <div class="status ${sc}"><span class="dot"></span>${lbl}</div>
 <div class="road"><svg class="scene" preserveAspectRatio="none" viewBox="0 0 100 100"><rect y="72" width="100" height="28" fill="#5c6168"/><line x1="0" y1="86" x2="100" y2="86" stroke="#FFB000" stroke-width="1.6" stroke-dasharray="4 3"/></svg>
 <div class="rig" style="left:${left}%;transform:translateX(-${left}%);${off?"opacity:.45;filter:grayscale(1)":""}">${rig(t.id)}</div>
 <span class="endlbl" style="left:8px;color:#fff">${yard}</span><span class="endlbl" style="right:8px;color:#fff">${t.destShort||"Drop site"}</span></div>
 <ol class="steps ${MODE==="owner"?"s6":"s4"}">${steps}</ol>
 ${badges.length?`<div class="badges">${badges.join("")}</div>`:""}
 ${invHtml}
 ${t.note?`<p class="note">${t.note}</p>`:""}
 </article>`}
fetch("trucks.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
 const T=d.trucks, yard=d.supplier.yard;
 $("#upd").textContent="Updated "+new Date(d.updatedAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" ET";
 const n=k=>T.filter(k).length;
 let cells;
 /*O*/if(MODE==="owner"){
  const owed=T.filter(t=>t.invoice&&!t.paid).reduce((a,t)=>a+t.invoice.amount,0);
  cells=[[T.length,"Trucks on our side"],[n(t=>t.approved),"Approved to ship"],[n(t=>t.stage==="delivered"),"Delivered"],[n(t=>t.invoice),"Invoiced by Advance"],[n(t=>t.paid),"Paid to Advance"]];
  $("#sum").innerHTML=cells.map(c=>`<div class="stat"><b>${c[0]}</b><span>${c[1]}</span></div>`).join("")+`<div class="stat money"><b>${money(owed)}</b><span>Owed to Advance</span><small>Real invoices only</small></div>`;
  if(d.estimate)$("#est").innerHTML=`<div class="est">Estimate, not owed yet: about ${money(d.estimate.amount).replace(".00","")} for ${d.estimate.loads} loads this season. ${d.estimate.note}</div>`;
 }else/*E*/{
  cells=[[T.length,"Truckloads"],[n(t=>t.stage==="approved"),"Need a ship date"],[n(t=>t.stage==="scheduled"),"Scheduled"],[n(t=>t.stage==="shipped"),"On the road"],[n(t=>t.stage==="delivered"),"Delivered"]];
  $("#sum").innerHTML=cells.map(c=>`<div class="stat"><b>${c[0]}</b><span>${c[1]}</span></div>`).join("");$("#sum").classList.add("n5");
 }
 $("#grid").innerHTML=T.map(t=>card(t,yard)).join("");
}).catch(()=>{$("#grid").innerHTML="<p>Could not load trucks. Pull to refresh.</p>"});
</script>
</body></html>
